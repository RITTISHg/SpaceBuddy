async function nget(u){const c=new AbortController(),tm=setTimeout(()=>c.abort(),9000);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(tm)}}

 const j=await nget(NIL+'/search?media_type=video&q='+encodeURIComponent(q));
 for(const it of (j.collection.items||[]).slice(0,6)){const d=it.data&&it.data[0];if(!d)continue;
  try{const a=await nget(NIL+'/asset/'+encodeURIComponent(d.nasa_id));const hs=a.collection.items.map(x=>x.href.replace(/^http:/,'https:')).filter(h=>/\.mp4$/i.test(h));
   const src=hs.find(h=>/~medium\.mp4$/i.test(h))||hs.find(h=>/~mobile\.mp4$/i.test(h))||hs.find(h=>/~small\.mp4$/i.test(h))||hs[0];
   if(!src)continue;const th=a.collection.items.map(x=>x.href.replace(/^http:/,'https:')).find(h=>/\.jpg$/i.test(h));
   const v={src,poster:th||'',title:d.title,id:d.nasa_id};try{sessionStorage.setItem(k,JSON.stringify(v))}catch(e){}return v}catch(e){}}
 throw new Error('none')}

// NASA Ref: O₂ ~0.84 kg/person/day (ECLSS), Water ~3.5 L/day (simplified), Food ~0.62 kg/day (simplified)
const DUR=20,CAPS={o2:120,water:150,food:60},RADLIM=45;
const WORLDS={

// Seeded PRNG (mulberry32)
function prng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function init(w,crew=4){return{w,crew,day:1,bp:60,bat:40,o2:40,water:100,food:38,rad:0,health:100,
 b:{solar:w==='mars'?4:3,bat:1,ls:1,gh:0,shield:0,medbay:0},
 lsBroken:false,dust:0,storm:0,light:1,eload:1,wuse:1,bk:false,fuel:3,crop:0,
 hist:[],log:[],lessons:[],pending:null,pendRand:null,over:null,hab:1,morale:70,
 rng:prng(Date.now()),fx:0}}

function flows(s){const W=WORLDS[s.w];let sun=W.sun(s.day);if(s.storm>0)sun*=.25;
 const gen=s.b.solar*18*sun*(1-s.dust)+(s.bk&&s.fuel>0?15:0);
 const dem=20+15*s.b.ls+W.heat+10*s.eload+s.b.gh*(5+7*s.light)+s.b.medbay*8;
 return{sun,gen,dem}}

function step(s){const W=WORLDS[s.w],f=flows(s),why=[];
 if(s.bk&&s.fuel>0){s.fuel--;why.push('Backup generator used 1 fuel day.')}
 let e=s.bat+f.gen-f.dem,brown=false;if(e<0){brown=true;e=0}s.bat=Math.min(e,s.b.bat*60);
 const pf=brown?.4:1,ls=s.lsBroken?0:pf;
 if(brown)why.push(`Brownout: needed ${r1(f.dem)} kWh, had ${r1(f.gen)} kWh + battery. Life support at 40%.`);
 const wu=s.crew*3.5*s.wuse,gu=(s.b.gh&&!brown)?s.b.gh*6:0,rec=(wu+gu)*.85*ls*Math.min(1,s.b.ls);
 s.water=clamp(s.water+rec-wu-gu,0,600);
 const og=s.b.ls*4.2*ls*(s.water>5?1:.5);s.o2=clamp(s.o2+og-s.crew*.84,0,200);
 if(s.b.gh&&!brown&&s.water>0)s.crop++;
 if(s.crop>=8){s.food+=s.b.gh*14;s.crop=0;why.push('🌿 Harvest! The greenhouse added food.')}
 s.food=Math.max(0,s.food-s.crew*.62);
 s.rad+=W.bg*(1-.25*Math.min(s.b.shield,3));
 let hp=0;
 if(brown)hp-=4;
 if(s.o2<s.crew*3){hp-=15;why.push('⚠️ Oxygen is critically low!')}
 if(s.water<=0){hp-=10;why.push('⚠️ No clean water left.')}
 if(s.food<=0){hp-=10;why.push('⚠️ Food has run out.')}
 if(s.rad>RADLIM)hp-=5;else if(s.rad>RADLIM*.66)hp-=2;
 // Medical bay heals +3 HP/sol when powered
 if(s.b.medbay>0&&!brown&&s.health<100){hp+=3;if(hp>0)why.push('🏥 Medical bay treating crew.')}
 // Morale
 if(s.food>10&&s.water>20&&!brown)s.morale=Math.min(100,s.morale+2);else s.morale=Math.max(10,s.morale-5);
 if(s.morale>70)hp+=1;
 s.health=clamp(s.health+hp,0,100);s.bp+=8;
 s.hist.push({d:s.day,gen:r1(f.gen),dem:r1(f.dem),bat:r1(s.bat/Math.max(1,s.b.bat*60)*100),
  o2:r1(s.o2/CAPS.o2*100),water:r1(s.water/CAPS.water*100),food:r1(s.food/CAPS.food*100),hp:s.health});
 if(s.storm>0)s.storm--;s.day++;
 if(s.health<=30||s.o2<=0)s.over='fail';else if(s.day>DUR)s.over='win';
 s.log.unshift(`Sol ${s.day-1}: `+(why[0]||'Systems steady.'));why.forEach(x=>s.lessons.push(x));
 if(!s.over){trigger(s);trigRand(s)}return why}

function preview(s){const c=JSON.parse(JSON.stringify(s));c.pending=c.pendRand=null;c.rng=()=>1;
 const b=[c.bat,c.o2,c.water,c.food,c.health];step(c);c.log=[];
 return{bat:c.bat-b[0],o2:c.o2-b[1],water:c.water-b[2],food:c.food-b[3],health:c.health-b[4],
  brown:c.hist[c.hist.length-1].gen+b[0]<c.hist[c.hist.length-1].dem&&c.bat===0}}

     {t:'Manual override',w:'Keeps running, but the glitch damages equipment slightly.',f:s=>{s.b.solar=Math.max(1,s.b.solar-1);return'Overrode glitch — but one solar array was damaged.'}}]},
 {id:'sample',prob:.12,t:'🪨 Interesting Rock Sample',x:'The rover found an unusual rock. Studying it could teach us something new.',
  c:[{t:'Study it (uses 10 kWh from battery)',w:'Science discovery! Boosts morale. But costs stored energy.',f:s=>{s.bat=Math.max(0,s.bat-10);s.morale+=15;s.health=Math.min(100,s.health+2);return'Studied the sample — morale boost! (+15 morale, +2 HP)'}},
     {t:'Store it for later',w:'Safe choice, but the crew is disappointed.',f:s=>{s.morale-=5;return'Stored the rock — crew wanted to study it. (-5 morale)'}}]},
 {id:'supply',prob:.08,t:'📦 Supply Cache Discovered',x:'Sensors found a pre-placed supply cache nearby. Retrieving it takes crew effort.',
  c:[{t:'Retrieve supplies (6 BP)',w:'Costs build points, but you gain resources.',f:s=>{if(s.bp<6)return'Not enough BP!';s.bp-=6;s.food+=12;s.water+=25;s.o2+=10;return'Retrieved cache: +12 food, +25 water, +10 O₂.'}},
     {t:'Mark location for later',w:'No cost, but you also get nothing. The cache may be buried by dust.',f:s=>'Marked the location — but the cache may not survive.'}]},
 {id:'comms',prob:.07,t:'📡 Communication Blackout',x:'Solar interference is blocking the radio link to Earth for this sol.',
  c:[{t:'Boost antenna power (costs 15 kWh)',w:'Restores partial communication but drains battery.',f:s=>{s.bat=Math.max(0,s.bat-15);s.bp+=3;return'Boosted signal — partial contact restored. (+3 BP from guidance)'}},
     {t:'Wait it out',w:'No energy cost, but you lose mission control guidance.',f:s=>{s.bp-=3;return'Waited out the blackout — lost guidance. (-3 BP)'}}]}
];
function trigger(s){const id=WORLDS[s.w].sched[s.day];if(id){const e=EV[id];if(e.pre)e.pre(s);s.pending=id}}
function trigRand(s){if(s.pending||s.pendRand)return;
 for(const re of RANDEV){if(s.rng()<re.prob){s.pendRand=re.id;return}}}
function choose(i){const s=S;
 if(s.pendRand){const re=RANDEV.find(x=>x.id===s.pendRand),r=re.c[i].f(s);
  s.lessons.push(`${re.t}: ${r}`);s.log.unshift(`Sol ${s.day}: ${r}`);s.pendRand=null;sfxAlert();render();return}
 const e=EV[s.pending],r=e.c[i].f(s);s.lessons.push(`${e.t}: ${r}`);s.log.unshift(`Sol ${s.day}: ${r}`);s.pending=null;sfxAlert();render()}

let S=null,tab='ov',qs={},testOut='';
const col=p=>p>.5?'var(--ok)':p>.25?'var(--wr)':'var(--cr)';
function gauge(ic,l,p,txt,sub){return`<div class="tile ${p<.25?'crit':''}"><b>${ic} ${l}</b><svg viewBox="0 0 100 58" role="img" aria-label="${l} ${txt}"><path class="trk" d="M10 50A40 40 0 0 1 90 50"/><path class="arc" pathLength="1" stroke="${col(p)}" d="M10 50A40 40 0 0 1 ${50-40*Math.cos(Math.PI*clamp(p,0,1))} ${50-40*Math.sin(Math.PI*clamp(p,0,1))}"/><text x="50" y="48">${txt}</text></svg><small>${sub}</small></div>`}
function state(p){return p>.5?t('o.normal'):p>.25?t('o.warn'):t('o.crit')}
function days(res,d){return d>=0?t('o.steady'):`~${Math.max(0,Math.floor(res/-d))} sols left`}
function line(keys,labels,cols){const h=S.hist;if(h.length<2)return'<p class="mu">Play a few sols to see trends.</p>';
 const W=320,H=130,mx=Math.max(100,...h.flatMap(x=>keys.map(k=>x[k])));
 const pl=keys.map((k,i)=>`<polyline fill="none" stroke="${cols[i]}" stroke-width="2.5" points="${h.map((x,j)=>`${10+j*(W-20)/(h.length-1)},${H-10-(x[k]/mx)*(H-20)}`).join(' ')}"/>`).join('');
 return`<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Trend chart: ${labels.join(', ')}">${pl}<line x1="10" x2="${W-10}" y1="${H-10}" y2="${H-10}" stroke="var(--ln)"/></svg><small>${labels.map((l,i)=>`<span style="color:${cols[i]}">● ${l}</span>`).join(' &nbsp; ')}</small>`}
function sl(l,k,v,min){return`<div class="sl"><label>${l}</label><input type="range" aria-label="${l}" min="${min}" max="100" value="${Math.round(v*100)}" oninput="S.${k}=this.value/100;this.nextElementSibling.textContent=this.value+'%'" onchange="render()"><b>${Math.round(v*100)}%</b></div>`}
function hint(s,p){return s.pending||s.pendRand?'🚨 Alert! Read it carefully and pick wisely.':p.brown?'⚠️ Battery runs out tomorrow! Save power now.':s.food<15&&!s.b.gh?'🌱 Food low — try building a greenhouse!':s.rad>RADLIM*.5?'☢️ Radiation rising — a shield helps!':s.health<60&&!s.b.medbay?'🏥 Crew health is low — a medical bay can help!':s.bp>=20?'🛠️ Points to spend — visit Outpost tab!':'👍 Looking good, Commander! Press Next Sol.'}
function scene(s){const f=flows(s),sp=Array.from({length:Math.min(s.b.solar,6)},(_,i)=>`<g class="pan"><polygon points="${15+i*26},98 ${35+i*26},98 ${31+i*26},84 ${11+i*26},84" fill="#2f6bff" stroke="#9fd6ff"/></g>`).join('');
 return`<svg class="scene" viewBox="0 0 400 140" role="img" aria-label="Animated outpost view">${[...Array(12)].map((_,i)=>`<circle class="tw" cx="${(i*67)%400}" cy="${(i*41)%60}" r="1.3" fill="#fff" style="animation-delay:${i*.2}s"/>`).join('')}<circle cx="335" cy="32" r="20" fill="#2c7be5"/><circle cx="330" cy="28" r="8" fill="#3ddc84" opacity=".7"/>${sp}<rect x="170" y="84" width="50" height="28" rx="8" fill="#cfd8ec"/><rect x="180" y="92" width="10" height="8" fill="#ffd45c"/>${s.b.gh?'<path d="M230 112a28 28 0 0 1 56 0z" fill="#3ddc84" opacity=".75"/><text x="244" y="110" font-size="16">🌱🌿</text>':''}${s.b.ls?'<rect x="296" y="90" width="14" height="22" fill="#9fb4de"/>':''}${s.b.medbay?'<rect x="120" y="90" width="16" height="20" rx="3" fill="#fff"/><text x="122" y="106" font-size="10">🏥</text>':''}<line x1="360" y1="112" x2="360" y2="76" stroke="#cfd8ec" stroke-width="3"/><circle class="tw" cx="360" cy="74" r="4" fill="#ff5468"/>${s.b.shield?`<circle class="tw" cx="230" cy="112" r="${70+s.b.shield*8}" fill="none" stroke="#a97bff" stroke-dasharray="5 5"/>`:''}
<path d="M0 112Q100 104 200 112T400 112V140H0z" fill="#46567d"/><g class="rover"><text x="30" y="130" font-size="18">🚙</text></g>${f.sun<.5?'<rect width="400" height="140" fill="#000" opacity=".5"/><text x="20" y="22" font-size="14" fill="#fff">🌑 Dark period</text>':''}${s.storm>0?[...Array(8)].map((_,i)=>`<circle class="sd" cx="${60+i*45}" cy="0" r="2.5" fill="#ffb020" style="animation-delay:${i*.15}s"/>`).join(''):''}</svg>`}

function ovw(){const s=S,f=flows(s),p=preview(s),W=WORLDS[s.w];
 const bp=s.bat/Math.max(1,s.b.bat*60),op=s.o2/CAPS.o2,wp=s.water/CAPS.water,fp=s.food/CAPS.food,rp=1-s.rad/RADLIM,hl=s.health/100;
 const dl=v=>(v>=0?'▲ +':'▼ ')+r1(v);
 return`<div class="g2"><div class="card"><h2>${W.ic} ${W.n} <span class="pill ${s.health>70?'ok':s.health>40?'wr':'cr'}">${s.health>70?t('o.stable'):s.health>40?t('o.attn'):t('o.danger')}</span></h2>${scene(s)}<div class="mas"><span class="astro">🧑‍🚀</span><div class="bub">${hint(s,p)}</div></div>
 <p class="mu">${t('o.sol')} ${s.day} / ${DUR}. ☀️ ${Math.round(f.sun*100*(s.storm?.25:1))}%. ⚡ Makes ${r1(f.gen)} kWh, needs ${r1(f.dem)} kWh. ${t('o.bp')}: <b>${s.bp}</b>. ❤️ Morale: ${s.morale}%</p>
 ${sl('🌱 Greenhouse lights','light',s.light,0)}${sl('🔬 Extra equipment','eload',s.eload,0)}${sl('💧 Water use','wuse',s.wuse,60)}<button onclick="act('bk')">${s.bk?'✅':'⬜'} Backup power (${s.fuel} fuel)</button>
 <p><button class="pri" onclick="act('next')" ${s.pending||s.pendRand?'disabled':''}>${t('o.next')}</button></p></div>
 <div class="card"><h3>👩‍🚀 ${t('o.health')}</h3><div class="crew">${'👩‍🚀'.repeat(s.crew)}</div><p><span class="pill ${s.health>70?'ok':s.health>40?'wr':'cr'}">${s.health>70?s.crew+'/'+s.crew+' healthy':'Health '+s.health+'%'}</span></p><small class="mu">${p.brown?'⚡ Brownout predicted tomorrow.':s.b.medbay&&s.health<100?'🏥 Medical bay is treating crew.':'No health problems right now.'}</small>${s.health<100&&s.b.medbay?'<div class="mu" style="margin-top:6px">🏥 Medical bay healing: +3 HP/sol</div>':''}</div></div>
 <div class="tiles">${gauge('⚡',t('o.power'),bp,Math.round(bp*100)+'%',state(bp)+' · '+dl(p.bat)+' kWh')}${gauge('🫧',t('o.oxygen'),op,r1(s.o2)+' kg',state(op)+' · '+days(s.o2,p.o2))}${gauge('💧',t('o.water'),wp,Math.round(s.water)+' L',state(wp)+' · '+days(s.water,p.water))}${gauge('🍽️',t('o.food'),fp,r1(s.food)+' kg',state(fp)+' · '+days(s.food,p.food)+(s.b.gh?' · harvest '+(8-s.crop)+'d':''))}${gauge('☢️',t('o.rad'),rp,Math.round(s.rad)+' mSv',s.rad<RADLIM*.5?'Low':s.rad<RADLIM?'Elevated':'Over limit')}${gauge('💜',t('o.health'),hl,s.health+'%',state(hl))}</div>
 <div class="g2"><div class="card"><h3>⚡ Power trend (kWh/sol)</h3>${line(['gen','dem'],['Generation','Consumption'],['#35c4ff','#ff9d1a'])}</div>
 <div class="card"><h3>📋 Activity</h3>${s.log.slice(0,5).map(x=>'<div>• '+x+'</div>').join('')||'<span class="mu">First sol waiting.</span>'}</div></div>`}

function outp(){const s=S;return`<div class="card"><h2>🛠️ ${t('nav.bd')}</h2><p class="mu">${t('o.bp')}: <b>${s.bp}</b> (+8 each sol). Every building has a cost and a real purpose.</p>${s.lsBroken?'<p><span class="pill cr">Life support broken</span> <button onclick="repair()">'+t('o.repair')+' (5 BP)</button></p>':''}
 <div class="grid">${Object.entries(BLD).map(([k,v])=>`<div class="card"><h3>${v[0]} ${v[1]} ×${s.b[k]}</h3><p class="mu">${v[3]}</p><button class="pri" onclick="build('${k}')" ${s.bp<v[2]||(k==='shield'&&s.b[k]>=3)?'disabled':''}>${t('o.build')} (${v[2]} BP)</button></div>`).join('')}</div>
 <p class="mu">💡 Tip: more solar panels need more batteries. Greenhouses need power and water. The medical bay uses 8 kWh. Check Overview before building!</p></div>`}

function learn(){return`<div class="card"><h2>${t('l.title')}</h2><div class="grid">${FACTS.map(f=>`<div class="card"><h3>${f[0]} ${f[1]}</h3><p>${f[2]}</p><details><summary class="mu">Learn more</summary><p>${f[5]}</p></details><a href="${f[4]}" target="_blank" rel="noopener" style="color:var(--ac)">📎 ${t('l.source')}: ${f[3]}</a></div>`).join('')}</div></div>
 <div class="card"><h2>${t('l.quiz')}</h2>${QZ.map((q,i)=>`<div style="margin:10px 0"><b>${q[0]}</b><br>${q[1].map((o,j)=>`<button onclick="qs[${i}]=${j};render()" ${qs[i]!==undefined?'disabled':''}>${o}</button> `).join('')}${qs[i]!==undefined?`<div>${qs[i]===q[2]?t('l.correct'):t('l.wrong')} ${q[3]}</div>`:''}</div>`).join('')}</div>`}

function logv(){const s=S;return`<div class="card"><h2>📋 Mission Log</h2>${s.log.map(x=>'<div>• '+x+'</div>').join('')||'<span class="mu">Nothing yet.</span>'}</div>
 <div class="card"><h3>🔬 Developer Check</h3><button onclick="testOut=runTests();render()">Run self-tests</button><pre style="white-space:pre-wrap">${testOut}</pre></div>`}

function report(){const s=S,win=s.over==='win',q=Object.keys(qs).filter(i=>qs[i]===QZ[i][2]).length;
 const sc=Math.round(s.health*6+Math.min(s.bp,60)+(s.day-1)*5+q*20+s.morale);
 return`<div class="card" style="text-align:center"><div class="hero">${win?'🏆':'🛟'}</div><h1>${win?t('r.win'):t('r.fail')}</h1><p>${win?`Your crew survived ${DUR} sols with ${s.health}% health and ${s.morale}% morale.`:`Crew lost on sol ${s.day-1}${s.o2<=0?' — oxygen ran out':' — health too low'}.`} ${t('r.score')}: <b>${sc}</b></p></div>
 <div class="g2"><div class="card"><h3>📊 Resource Trends (%)</h3>${line(['bat','o2','water','food'],['Battery','Oxygen','Water','Food'],['#ffc53d','#35c4ff','#7da2ff','#3ddc84'])}</div><div class="card"><h3>${t('r.learned')}</h3>${[...new Set(s.lessons)].slice(-8).map(x=>'<div>• '+x+'</div>').join('')||'You played it safe!'}</div></div>
 <p style="text-align:center"><button class="pri" onclick="S=null;render()">${t('r.try')}</button></p>`}

async function api(path,opt){const c=new AbortController(),tm=setTimeout(()=>c.abort(),(opt&&opt.t)||5000);try{const r=await fetch(API+path,Object.assign({signal:c.signal,headers:{'Content-Type':'application/json'}},opt));if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(tm)}}

let GAL=[],GI=0;
async function galLoad(){sayO('gal','Your photo gallery!');const e=$('gal');if(!e)return;let l=[];try{l=await api('/api/gallery')}catch(_){try{l=await (await fetch('/gallery/manifest.json')).json()}catch(_){}}
 GAL=(l||[]).map(n=>'/gallery/'+encodeURIComponent(n));
 e.innerHTML=GAL.length?`<div class="card"><h2>📸 Photo Gallery</h2><p class="mu">${GAL.length} photos · tap one to zoom, use ◀ ▶ keys to browse</p></div><div class="galg">${GAL.map((u,i)=>`<figure class="galf" style="animation-delay:${Math.min(i,24)*70}ms" onclick="galOpen(${i})"><img src="${u}" loading="lazy" alt="Gallery photo ${i+1}"></figure>`).join('')}</div>`:`<div class="card"><h2>📸 Photo Gallery</h2><p class="mu">Add your photos to the <b>public/gallery</b> folder and refresh this page. They will appear here with animation.</p></div>`}
function galOpen(i){GI=(i+GAL.length)%GAL.length;let o=$('galb');if(!o){o=document.createElement('div');o.id='galb';o.className='galb';o.onclick=e=>{if(e.target===o)galClose()};document.body.appendChild(o)}o.innerHTML=`<button class="galx" onclick="galClose()">✕</button><button class="galn" style="left:12px" onclick="galOpen(GI-1)">◀</button><img src="${GAL[GI]}" class="galz" alt="Gallery photo ${GI+1}"><button class="galn" style="right:12px" onclick="galOpen(GI+1)">▶</button>`}
function galClose(){const o=$('galb');if(o)o.remove()}
addEventListener('keydown',e=>{if(!$('galb'))return;if(e.key==='ArrowRight')galOpen(GI+1);else if(e.key==='ArrowLeft')galOpen(GI-1);else if(e.key==='Escape'){galClose();e.stopImmediatePropagation()}},true);

/* ── Star Field ────────────────────────────────────────────────── */
(function(){const c=$('sky'),x=c.getContext('2d');let st=[],sh=null;
 function rs(){c.width=innerWidth;c.height=innerHeight;st=Array.from({length:120},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.6+.3,p:Math.random()*6,v:Math.random()*.02+.01}))}
 function fr(){x.clearRect(0,0,c.width,c.height);x.fillStyle='#fff';st.forEach(s=>{x.globalAlpha=.4+.6*Math.abs(Math.sin(s.p+=s.v));x.beginPath();x.arc(s.x,s.y,s.r,0,7);x.fill();s.y+=s.v*3;if(s.y>c.height)s.y=0});if(!sh&&Math.random()<.004)sh={x:Math.random()*c.width*.7,y:0};if(sh){x.globalAlpha=1;x.strokeStyle='#9fd6ff';x.lineWidth=2;x.beginPath();x.moveTo(sh.x,sh.y);x.lineTo(sh.x-40,sh.y-20);x.stroke();sh.x+=9;sh.y+=4.5;if(sh.y>c.height||sh.x>c.width+50)sh=null}requestAnimationFrame(fr)}
 rs();addEventListener('resize',rs);if(!matchMedia('(prefers-reduced-motion:reduce)').matches)fr()})();

/* ── Self-Tests ────────────────────────────────────────────────── */
function runTests(){const keep=S,R=[],T=(n,c)=>R.push((c?'PASS ':'FAIL ')+n);
 let s=init('moon');s.pending=s.pendRand=null;let f=flows(s),b0=s.bat;step(s);T('Energy balance: battery change = generation - demand',Math.abs((s.bat-b0)-(f.gen-f.dem))<.01);
 s=init('moon');s.day=11;s.bat=0;s.pending=s.pendRand=null;let o=s.o2;step(s);T('Night + empty battery causes brownout',s.o2-o<4.2*.4-3.36+.01&&s.hist[0].bat===0);
 s=init('moon');s.b.gh=1;s.b.bat=5;s.bat=300;s.pending=s.pendRand=null;let fd=s.food;for(let i=0;i<8;i++){s.pending=s.pendRand=null;step(s)}T('Greenhouse harvests after 8 sols',s.food>fd-8*2.48+10);
 s=init('moon');s.lsBroken=true;s.pending=s.pendRand=null;let w=s.water;step(s);T('Water failure stops recycling',Math.abs((w-s.water)-14)<.01);
 let a=init('moon'),c2=init('moon');a.pending=c2.pending='storm';a.day=c2.day=6;S=a;choose(2);S=c2;choose(0);T('Outside gives more radiation than shelter',a.rad>c2.rad+10);
 a=init('moon');a.b.shield=2;a.pending='storm';S=a;choose(2);T('Shields reduce storm dose',a.rad<22);
 s=init('moon');s.o2=1;s.lsBroken=true;s.pending=s.pendRand=null;step(s);T('Fail when oxygen depleted',s.over==='fail');
 s=init('moon');s.pending=s.pendRand=null;for(let i=0;i<30&&!s.over;i++){s.pending=s.pendRand=null;step(s)}T('Mission ends at sol '+DUR,s.over!==null&&s.day<=DUR+1);
 T('Lunar night sunlight is 10%',WORLDS.moon.sun(11)===.1&&WORLDS.moon.sun(5)===1);
 // New tests
 s=init('moon');s.b.medbay=1;s.health=80;s.pending=s.pendRand=null;const hBefore=s.health;step(s);T('Medical bay heals crew',s.health>=hBefore);
 s=init('moon');T('Seeded PRNG produces deterministic values',typeof s.rng()==='number'&&s.rng()!==s.rng());
 T('i18n returns English strings',t('app.title')==='SPACEBUDDY');
 T('i18n Tamil fallback works',TR.ta['app.title']==='SPACEBUDDY');
 T('NASA videos array populated',VIDEOS.length>=6);
 T('Quiz questions available',QZ.length>=6);
 T('Random events defined',RANDEV.length>=4);
 T('Buildings include medbay',!!BLD.medbay);
 S=keep;return R.join('\n')}
